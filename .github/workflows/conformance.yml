name: Conformance

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  formats:
    name: formats
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: build the multiprocess example
        run: |
          moon build src/examples/09-multiprocess --target native
          # The native artifact keeps the .exe suffix on every platform.
          find _build/native -type f -name '09-multiprocess*' -perm -u+x | head -1 > /tmp/binary
          cat /tmp/binary

      - name: install prometheus
        run: |
          curl -fsSL -o /tmp/prometheus.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v3.6.0/prometheus-3.6.0.linux-amd64.tar.gz
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          sudo cp /tmp/prometheus-3.6.0.linux-amd64/promtool /usr/local/bin/promtool
          promtool --version

      - name: install the reference client
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet prometheus_client==0.26.0
          /tmp/venv/bin/python -c "import prometheus_client; print('prometheus_client installed')"

      - name: the same operations, both ways, against prometheus_client
        run: /tmp/venv/bin/python scripts/check_multiprocess.py --binary "$(cat /tmp/binary)"

      - name: promtool and a real Prometheus, compatibility format
        run: |
          /tmp/venv/bin/python scripts/check_prometheus.py \
            --binary "$(cat /tmp/binary)" \
            --promtool promtool \
            --docker-image prom/prometheus:v3.6.0 \
            --format text

      - name: promtool and a real Prometheus, OpenMetrics
        run: |
          /tmp/venv/bin/python scripts/check_prometheus.py \
            --binary "$(cat /tmp/binary)" \
            --promtool promtool \
            --docker-image prom/prometheus:v3.6.0 \
            --format openmetrics

      - name: a real Prometheus, protobuf
        run: |
          /tmp/venv/bin/python scripts/check_prometheus.py \
            --binary "$(cat /tmp/binary)" \
            --docker-image prom/prometheus:v3.6.0 \
            --format protobuf

      - uses: actions/setup-go@v6
        with:
          go-version-file: scripts/native/compare/go.mod
          cache: false

      # client_golang writes the vectors; the test replays them and compares bytes. A stale
      # test file means the library and the vectors were checked against different outputs.
      - name: native histogram vectors are client_golang's current output
        run: |
          (cd scripts/native/compare && go mod tidy && go run .) > "$RUNNER_TEMP/vectors.json"
          python3 scripts/native/gen_vectors.py "$RUNNER_TEMP/vectors.json"
          moon fmt
          git diff --exit-code src/expo/native_vectors_wbtest.mbt

      - name: native histograms, scraped by Prometheus beside client_golang
        run: |
          moon build src/examples/10-native --target native
          (cd scripts/native/compare && go build -o "$RUNNER_TEMP/compare" .)
          python3 scripts/native/check_scrape.py \
            --example "$(find _build/native -type f -name '10-native*' -perm -u+x | head -1)" \
            --golang "$RUNNER_TEMP/compare" \
            --prometheus /tmp/prometheus-3.6.0.linux-amd64/prometheus
